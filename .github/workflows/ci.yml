# Draft CI — Phase 0 completes the app steps once package.json exists.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Schema + smoke tests
        run: bash supabase/tests/run-local.sh pizzadam_test

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has_app
        run: echo "present=$([ -f package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_app.outputs.present == 'yes'
        with:
          node-version: lts/*
          cache: npm
      - if: steps.has_app.outputs.present == 'yes'
        run: npm ci
      - if: steps.has_app.outputs.present == 'yes'
        run: npm run lint
      - if: steps.has_app.outputs.present == 'yes'
        run: npm run typecheck
      - if: steps.has_app.outputs.present == 'yes'
        run: npm test
