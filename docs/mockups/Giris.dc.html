<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Personel girişi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2381B}a:hover{color:#9E2C14}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden">

  <header style="display: flex; justify-content: flex-end; padding: 16px">
    <button onClick="{{toggleTheme}}" aria-label="Temayı değiştir" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      </sc-if>
    </button>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px 80px; gap: 28px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <div style="width: 64px; height: 64px; border-radius: 18px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c5.5-3 12.5-3 18 0L12 21z"></path><circle cx="10" cy="9" r="1.2"></circle><circle cx="14" cy="12" r="1.2"></circle><circle cx="11.5" cy="15" r="1"></circle></svg>
      </div>
      <div>
        <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.4px">Pizzadam</div>
        <div style="font-size: 15px; color: {{c.muted}}; margin-top: 4px">Personel girişi</div>
      </div>
      <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{c.accentSoft}}; color: {{c.accent}}">De Pijp şubesi</span>
    </div>

    <form style="display: flex; flex-direction: column; gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
        Kullanıcı adı
        <input type="text" autocomplete="username" placeholder="ornek: ahmet.yilmaz" style="height: 52px; border-radius: 14px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; padding: 0 16px; font-size: 16px; font-weight: 400">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
        Şifre
        <span style="position: relative; display: block">
          <input type="{{pwType}}" autocomplete="current-password" style="width: 100%; box-sizing: border-box; height: 52px; border-radius: 14px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; padding: 0 56px 0 16px; font-size: 16px; font-weight: 400">
          <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: {{c.muted}}; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </span>
      </label>
      <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 16px; font-weight: 700; margin-top: 4px">Giriş yap</button>
    </form>

    <p style="margin: 0; text-align: center; font-size: 13px; color: {{c.muted}}">Şifreni unuttuysan patronundan sıfırlamasını iste.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
var PALETTES = {
  light: { bg: '#F6F4F1', surface: '#FFFFFF', surface2: '#F0EDE8', text: '#1C1917', muted: '#665E57', border: '#E4DFD8', accent: '#C2381B', accentSoft: '#FBE9E4', onAccent: '#FFFFFF' },
  dark: { bg: '#141210', surface: '#1E1B18', surface2: '#29251F', text: '#F3EFEA', muted: '#A9A096', border: '#37322B', accent: '#F06A4A', accentSoft: '#3A1F17', onAccent: '#1A0B06' }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null, showPw: false };
  }
  renderVals() {
    var self = this;
    var theme = this.state.theme || this.props.theme || 'light';
    return {
      c: PALETTES[theme] || PALETTES.light,
      isDark: theme === 'dark',
      isLight: theme !== 'dark',
      pwType: this.state.showPw ? 'text' : 'password',
      pwLabel: this.state.showPw ? 'Şifreyi gizle' : 'Şifreyi göster',
      togglePw: function () { self.setState({ showPw: !self.state.showPw }); },
      toggleTheme: function () { self.setState({ theme: theme === 'dark' ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
