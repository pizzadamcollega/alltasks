<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Raporlar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2381B}a:hover{color:#9E2C14}
button,select{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; font-variant-numeric: tabular-nums; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px">
    <a href="Patron.dc.html" aria-label="Geri" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: {{c.text}}">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="flex: 1; margin: 0; font-size: 20px; font-weight: 700">Raporlar</h1>
    <button onClick="{{toggleTheme}}" aria-label="Temayı değiştir" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      </sc-if>
    </button>
  </header>

  <div style="display: flex; gap: 8px; padding: 0 16px 12px">
    <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: {{c.muted}}">Ay
      <select style="height: 44px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; padding: 0 10px; font-size: 15px; font-weight: 600">
        <option>Ekim 2026</option><option>Eylül 2026</option><option>Ağustos 2026</option>
      </select>
    </label>
    <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: {{c.muted}}">Şube
      <select style="height: 44px; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; padding: 0 10px; font-size: 15px; font-weight: 600">
        <option>De Pijp</option><option>Zuid (admin)</option><option>Tüm şubeler (admin)</option>
      </select>
    </label>
  </div>

  <main style="flex: 1; overflow-y: auto; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px">

    <section aria-label="Ay özeti" style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">Onaylı personel gideri</span>
        <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.6px">€6.510,40</span>
        <span style="font-size: 13px; color: {{c.muted}}">494 sa 00 dk · 6 çalışan · 1–23 Ekim</span>
      </div>
      <div role="img" aria-label="Günlük gider, 1–24 Ekim. En yüksek günler cumartesiler, yaklaşık 420 euro. 24 Ekim 435 euro, onay bekliyor." style="display: flex; flex-direction: column; gap: 6px">
        <div style="height: 110px; display: flex; align-items: flex-end; gap: 3px; border-bottom: 1px solid {{c.border}}">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="24">
            <span style="{{b.style}}"></span>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: {{c.muted}}">
          <span>1 Eki</span><span>8</span><span>15</span><span>22</span><span>24</span>
        </div>
      </div>
      <div style="display: flex; gap: 14px; font-size: 12px; color: {{c.muted}}">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{c.accent}}"></span>Onaylı</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 2px; background: {{c.warn}}"></span>Onay bekliyor</span>
      </div>
    </section>

    <section aria-label="Kişi bazlı" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Kişi bazlı döküm</h2>
      <div style="background: {{c.surface}}; border: 1px solid {{c.border}}; border-radius: 16px; overflow: hidden">
        <sc-for list="{{people}}" as="p" hint-placeholder-count="6">
          <a href="Calisan.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 48px; text-decoration: none; color: {{c.text}}; border-top: {{p.divider}}">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 14px; font-weight: 600">{{p.name}}</div>
              <div style="font-size: 12px; color: {{c.muted}}; margin-top: 2px">{{p.sub}}</div>
            </div>
            <div style="text-align: right">
              <div style="font-size: 14px; font-weight: 700">{{p.left}}</div>
              <div style="font-size: 11px; color: {{c.muted}}; margin-top: 2px">kalan</div>
            </div>
          </a>
        </sc-for>
        <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-top: 1px solid {{c.border}}; background: {{c.surface2}}; font-size: 14px; font-weight: 700">
          <span>Toplam · avans €300,00</span><span>€6.210,40</span>
        </div>
      </div>
    </section>

    <sc-if value="{{exporting}}" hint-placeholder-val="{{false}}">
      <div role="status" style="background: {{c.okSoft}}; color: {{c.ok}}; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600">{{exportNote}}</div>
    </sc-if>
  </main>

  <div style="padding: 12px 16px 18px; border-top: 1px solid {{c.border}}; background: {{c.surface}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button onClick="{{exportXlsx}}" style="height: 50px; border-radius: 12px; border: 1px solid {{c.border}}; background: transparent; color: {{c.text}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8l4 5M12 8l-4 5M14 9h3M14 13h3M8 17h9"></path></svg>
      Excel
    </button>
    <button onClick="{{exportPdf}}" style="height: 50px; border-radius: 12px; border: 0; background: {{c.accent}}; color: {{c.onAccent}}; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"></path></svg>
      PDF
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
var PALETTES = {
  light: { bg: '#F6F4F1', surface: '#FFFFFF', surface2: '#F0EDE8', text: '#1C1917', muted: '#665E57', border: '#E4DFD8', accent: '#C2381B', accentSoft: '#FBE9E4', onAccent: '#FFFFFF', ok: '#1E7549', okSoft: '#E3F3EA', warn: '#C27A00' },
  dark: { bg: '#141210', surface: '#1E1B18', surface2: '#29251F', text: '#F3EFEA', muted: '#A9A096', border: '#37322B', accent: '#F06A4A', accentSoft: '#3A1F17', onAccent: '#1A0B06', ok: '#5CC98E', okSoft: '#16301F', warn: '#F2B04A' }
};
var DAILY = [237.41, 383.5, 420.03, 292.19, 210.01, 200.88, 219.14, 237.41, 383.5, 420.03, 292.19, 210.01, 200.88, 219.14, 237.41, 383.5, 420.03, 292.19, 210.01, 200.88, 219.14, 237.41, 383.51, 435.25];
var PEOPLE = [
  { name: 'Murat Demir', sub: '100 sa 00 dk · €1.400,00', left: '€1.400,00' },
  { name: 'Sena Aksoy', sub: '95 sa 00 dk · €1.235,00', left: '€1.235,00' },
  { name: 'Can Öztürk', sub: '90 sa 00 dk · €1.215,00', left: '€1.215,00' },
  { name: 'Deniz Arslan', sub: '83 sa 45 dk · €1.067,81', left: '€1.067,81' },
  { name: 'Elif Kaya', sub: '71 sa 20 dk · €891,67 · avans €150', left: '€741,67' },
  { name: 'Ahmet Yılmaz', sub: '53 sa 55 dk · €700,92 · avans €150', left: '€550,92' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: null, exporting: null };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var theme = s.theme || this.props.theme || 'light';
    var c = PALETTES[theme] || PALETTES.light;
    var bars = DAILY.map(function (v, i) {
      var pending = i === DAILY.length - 1;
      return { style: 'flex: 1; height: ' + Math.round(v / 450 * 100) + '%; border-radius: 3px 3px 0 0; background: ' + (pending ? c.warn : c.accent) + ';' };
    });
    var people = PEOPLE.map(function (p, i) { return { name: p.name, sub: p.sub, left: p.left, divider: i === 0 ? 'none' : '1px solid ' + c.border }; });
    return {
      c: c,
      isDark: theme === 'dark',
      isLight: theme !== 'dark',
      bars: bars,
      people: people,
      exporting: !!s.exporting,
      exportNote: s.exporting ? 'Ekim_2026_DePijp.' + s.exporting + ' hazırlandı · indiriliyor' : '',
      exportXlsx: function () { self.setState({ exporting: 'xlsx' }); },
      exportPdf: function () { self.setState({ exporting: 'pdf' }); },
      toggleTheme: function () { self.setState({ theme: theme === 'dark' ? 'light' : 'dark' }); }
    };
  }
}
</script>
</body>
</html>
